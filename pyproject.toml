[project]
name = "newsletter-service"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
requires-python = "^3.13"
dependencies = [
    "django (>=6.0.5,<7.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "redis (>=8.0.0,<9.0.0)",
    "django-redis (>=6.0.0,<7.0.0)",
    "pillow (>=12.2.0,<13.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=26.5.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=2.1.0,<3.0.0)"
]


[tool.black]
line-length = 120
target-version = ['py313']
exclude = '''
(
  /(
      \.eggs

    | \.git
    | \.hg
    | \.mypy_cache

    | \.tox
    | \.venv
    | _build

    | buck-out
    | build
    | dist
    | migrations
  )/
)
'''

[tool.isort]
profile = "black"
line_length = 120
multi_line_output = 3
skip = ["migrations", ".venv"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
exclude = ["venv", ".venv", "migrations"]
