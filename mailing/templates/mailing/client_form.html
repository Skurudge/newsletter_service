{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm my-4 text-start">
            <div class="card-header bg-dark text-white py-3">
                <h4 class="m-0 fw-bold">{% if object %}Редактирование{% else %}Добавление{% endif %} получателя</h4>
            </div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="mb-3">
                            <label class="form-label fw-semibold">{{ field.label }}</label>
                            {{ field }}
                            {% if field.errors %}
                                <div class="text-danger small mt-1">{{ field.errors }}</div>
                            {% endif %}
                        </div>
                    {% endfor %}
                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a href="{% url 'mailing:client_list' %}" class="btn btn-outline-secondary">Отмена</a>
                        <button type="submit" class="btn btn-success">Сохранить данные</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
