{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm my-4 text-start">
            <div class="card-header bg-dark text-white py-3">
                <h4 class="m-0 fw-bold">{% if object %}Правка публикации{% else %}Создание новой статьи{% endif %}</h4>
            </div>
            <div class="card-body p-4">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Заголовок статьи *</label>
                        <input type="text" name="title" class="form-control" value="{{ form.title.value|default:'' }}" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Текст (содержимое) публикации *</label>
                        <textarea name="content" class="form-control" rows="10" required>{{ form.content.value|default:'' }}</textarea>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label fw-semibold d-block">Изображение (превью)</label>
                        {% if object.image %}
                            <div class="mb-2"><img src="{{ object.image.url }}" class="img-thumbnail" style="max-height: 120px;"></div>
                        {% endif %}
                        <input type="file" name="image" class="form-control">
                    </div>
                    
                    <div class="mb-3 form-check form-switch fs-5">
                        <input type="checkbox" name="is_published" id="id_is_published" class="form-check-input" {% if form.is_published.value or not object %}checked{% endif %}>
                        <label for="id_is_published" class="form-check-label small fw-semibold text-secondary">Отображать статью на витрине блога</label>
                    </div>
                    
                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a href="{% url 'blog:list' %}" class="btn btn-outline-secondary">Отмена</a>
                        <button type="submit" class="btn btn-success px-4">Сохранить материал</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
