<!DOCTYPE html>
{% load static %}
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Сервис управления рассылками{% endblock %}</title>
    <!-- Подключаем Bootstrap 5 CSS локально из подпапки css -->
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; min-height: 100vh; display: flex; flex-direction: column; }
        .footer { margin-top: auto; }
    </style>
</head>
<body class="d-flex flex-column">

    <!-- Вставляем меню навигации -->
    {% include 'includes/menu.html' %}

    <div class="container my-4">
        <!-- Блок вывода всплывающих уведомлений -->
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags }}{% endif %} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endfor %}
        {% endif %}

        <!-- Основной контент страниц -->
        {% block content %}
        {% endblock %}
    </div>

    <footer class="footer bg-dark text-light py-3 mt-auto border-top border-secondary">
        <div class="container text-center">
            <span class="text-muted">© 2026 NewsletterService. Курсовой проект Django.</span>
        </div>
    </footer>

    <!-- Подключаем Bootstrap 5 JS локально из подпапки js -->
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
